# Check the documentation on every push and PR. From main, publish it to the
# product's own domain when shared.json names one; every product is also built
# into docs.dlab5.net by d-lab-5/d-lab-5.github.io, which needs nothing from
# this workflow. Owned by template-dlab5-shared: `copier update` replaces it.
# Actions are pinned to commit SHAs; the comment names the release.
name: docs

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # diagrams in step, ontology parses, site builds, nothing private (scripts/check.mjs)
      - run: npm run check
      - run: npm run site
      - id: own
        run: echo "domain=$(node -p "require('./shared.json').own_domain || ''")" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.own.outputs.domain != ''
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.own.outputs.domain != ''
        with:
          path: _site
    outputs:
      own_domain: ${{ steps.own.outputs.domain }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.own_domain != ''
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
